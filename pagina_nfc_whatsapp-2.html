<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#128C7E">
<title>Fale conosco</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(145deg,#e9fff8,#f7fffd);display:flex;align-items:center;justify-content:center;padding:24px;color:#17332e}
.card{width:100%;max-width:420px;background:#fff;border-radius:28px;padding:34px 24px 28px;box-shadow:0 14px 45px rgba(0,0,0,.12);text-align:center}
.logo{width:78px;height:78px;margin:0 auto 16px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;font-size:38px}
h1{margin:0 0 8px;font-size:28px} p{margin:0 0 26px;color:#63736f;font-size:16px}
.btn{display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff;background:#25D366;border-radius:16px;padding:16px 18px;margin:12px 0;font-weight:700;font-size:17px;box-shadow:0 6px 16px rgba(37,211,102,.22)}
.icon{font-size:25px}.btn span:last-child{flex:1;text-align:left}
small{display:block;margin-top:22px;color:#91a09c;font-size:12px}
</style>
</head>
<body>
<main class="card">
  <div class="logo">💬</div>
  <h1>Fale conosco</h1>
  <p>Escolha com quem você deseja falar pelo WhatsApp:</p>

  <a class="btn" href="https://wa.me/5513996050615" target="_blank" rel="noopener">
    <span class="icon">👩</span><span>Mamãe Talita</span><span>›</span>
  </a>

  <a class="btn" href="https://wa.me/5513991034711" target="_blank" rel="noopener">
    <span class="icon">👨</span><span>Papai Vinicius</span><span>›</span>
  </a>

  <small>Toque em uma opção para abrir o WhatsApp</small>
</main>
</body>
</html>
